services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: knowledge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["knowledge-data:/var/lib/postgresql/data"]
  migrate:
    build: .
    env_file: .env
    command: ["python", "-m", "knowledge_runtime.database"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  knowledge-data:
