[project]
name = "knowledge-workflow-runtime"
version = "0.1.0"
description = "Lifecycle-aware retrieval, native MCP tools and bounded document intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "asyncpg>=0.30,<1", "pgvector>=0.3,<1", "httpx>=0.28,<1",
  "mcp>=1.20,<2", "pypdf>=6.1,<7", "pillow>=11.3,<13",
  "defusedxml>=0.7,<1", "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8",
  "ruff>=0.9,<1", "mypy>=1.14,<2", "asyncpg-stubs>=0.30,<1",
  "types-defusedxml>=0.7", "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["knowledge_runtime"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: real PostgreSQL/pgvector", "wire: native MCP stdio subprocess"]

[tool.coverage.run]
core = "ctrace"
source = ["knowledge_runtime"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):"]
