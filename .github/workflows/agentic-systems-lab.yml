name: Agentic Systems Lab

on:
  pull_request:
    paths:
      - 'examples/agentic-systems-lab/**'
      - '.github/workflows/agentic-systems-lab.yml'
  push:
    branches: [main]
    paths:
      - 'examples/agentic-systems-lab/**'
      - '.github/workflows/agentic-systems-lab.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/agentic-systems-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
