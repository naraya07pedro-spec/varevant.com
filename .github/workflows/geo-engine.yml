name: VAREVANT Autonomous GEO Engine

on:
  schedule:
    - cron: "0 1 * * *" # 08:00 WIB / Asia/Jakarta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: varevant-geo-engine
  cancel-in-progress: false

jobs:
  daily-geo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit and decide
        run: python geo/engine.py --mode daily

      - name: Quality gate
        run: python geo/qa.py

      - name: Commit daily log only when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- geo/logs)" ]]; then
            echo "No GEO log changes to commit."
            exit 0
          fi
          git config user.name "varevant-geo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add geo/logs
          git commit -m "chore(geo): daily observation log"
          git push
